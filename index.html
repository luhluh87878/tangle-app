<style>

      background: #e9ecef; border-left: 4px solid #007bff; padding: 12px 15px;

  .tutorial-box strong { color: #0056b3; font-size: 15px; display: block; margin-bottom: 6px; }

  .slider-group { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #444; font-size: 14px;}

  .btn-reset { padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #dc3545; color: #fff; width: 100%; font-size: 16px; box-shadow: 0 2px 4px rgba(220,53,69,0.3); transition: transform 0.1s;}
  .btn-reset:active { transform: scale(0.98); }

  #scroll-wrapper { width: calc(100% - 20px); height: 50vh; overflow: auto; border: 2px solid #ccc; background: #fff; border-radius: 6px; margin: 0 10px; position: relative;}
  #layout-grid { display: grid; grid-template-columns: 35px max-content; grid-template-rows: 35px max-content; width: max-content; }

  #corner { grid-column: 1; grid-row: 1; position: sticky; top: 0; left: 0; z-index: 20; background: #eaeaea; border-right: 1px solid #aaa; border-bottom: 1px solid #aaa; }
  #axis-x { grid-column: 2; grid-row: 1; position: sticky; top: 0; z-index: 15; background: #f4f4f4; border-bottom: 1px solid #aaa; }
  #axis-y { grid-column: 1; grid-row: 2; position: sticky; left: 0; z-index: 15; background: #f4f4f4; border-right: 1px solid #aaa; }

  .axis-inner { position: relative; width: 100%; height: 100%; }
  #board-container { grid-column: 2; grid-row: 2; padding: 20px; background: #fff; }

  #board {
      position: relative; 
      background-size: var(--cell) var(--cell);
      background-position: calc(var(--cell)/2) calc(var(--cell)/2);
      background-image: linear-gradient(to right, #ddd 1px, transparent 1px), linear-gradient(to bottom, #ddd 1px, transparent 1px);
      border-right: 1px solid #ddd; border-bottom: 1px solid #ddd;
  }

  .axis-label-x { position: absolute; bottom: 4px; transform: translateX(-50%); font-size: 11px; font-weight: bold; color: #555; }
  .axis-label-y { position: absolute; right: 4px; transform: translateY(-50%); font-size: 11px; font-weight: bold; color: #555; }

  .node {
      position: absolute; width: calc(var(--cell) * 0.8); height: calc(var(--cell) * 0.8);
      transform: translate(-50%, -50%); border-radius: 50%; display: flex; justify-content: center; align-items: center;
      transition: transform 0.1s; z-index: 5; 
  }

  .node.valid-parity { cursor: pointer; }
  .node.valid-parity::before {
      content: ''; position: absolute; width: 8px; height: 8px;
      background: #cce5ff; border-radius: 50%; transition: all 0.2s; z-index: -1;
  }
  .node.valid-parity:hover::before { transform: scale(2.5); background: #99ccff; }
  .node.target::before, .node.obstacle::before, .node.center::before { display: none; }

  .node.invalid-parity {
      width: 12px; height: 12px; min-width: 12px; min-height: 12px;
      background-color: transparent; pointer-events: none; border-radius: 0;
      background-image: 
          linear-gradient(45deg, transparent 40%, #dee2e6 40%, #dee2e6 60%, transparent 60%),
          linear-gradient(-45deg, transparent 40%, #dee2e6 40%, #dee2e6 60%, transparent 60%);
  }

  .node.target { font-size: calc(var(--cell) * 0.6); z-index: 6; text-shadow: 0 0 4px #fff;}
  .node.obstacle { font-size: calc(var(--cell) * 0.5); z-index: 6; color: #dc3545; font-weight: bold;}
  .node.center { font-size: calc(var(--cell) * 0.7); z-index: 7; cursor: not-allowed; }
  
  #svg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;

  .loader { display: inline-block; width: 12px; height: 12px; border: 2px solid #007bff; border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; margin-right: 6px; vertical-align: middle;}

  .badge-label { position: absolute; top: -1px; left: -1px; background: #222; color: #fff; font-size: 10px; padding: 2px 6px; border-bottom-right-radius: 6px; font-weight: bold; z-index: 10; }

  #strip-preview-container {

          page-break-inside: avoid; page-break-after: avoid; margin-bottom: 0 !important;
      }

<script>
  /* =========================================================================
     1. Web Worker 背景腳本 (無限制搜尋)
  ========================================================================= */
  const workerCode = `
      const TRANS_DX = new Int8Array([-1, 1, 1, 1, 1, -1, -1, -1]);
      const TRANS_DY = new Int8Array([1, 1, 1, -1, -1, -1, -1, 1]);
      const TRANS_NDIR = new Uint8Array([3, 1, 0, 2, 1, 3, 2, 0]);

      function solveTwistyTurnyOptimized(totalSteps, rawTargets, rawObstacles, requiredCount) {
          const R = Math.floor(totalSteps / 2);
          const W = 2 * R + 1;
          const totalCells = W * W;
          const getIdx = (x, y) => (y + R) * W + (x + R);

          const targets = [];
          for (let i = 0; i < rawTargets.length; i++) {
              const t = rawTargets[i];
              if (t[0] !== 0 || t[1] !== 0) targets.push(t);
          }
          const K = targets.length;
          if (K > 20) return { status: "error", nodes: [], msg: "❌ 目標點過多 (上限 20 個)！" };

          const obstacleMap = new Uint8Array(totalCells);
          for (let i = 0; i < rawObstacles.length; i++) {
              const o = rawObstacles[i];
              if (Math.abs(o[0]) <= R && Math.abs(o[1]) <= R) {
                  obstacleMap[getIdx(o[0], o[1])] = 1;
              }
          }

          if (obstacleMap[getIdx(0, 0)] === 1) return { status: "error", nodes: ["0,0"], msg: "❌ 起點不能是障礙物！" };

          for (let i = 0; i < K; i++) {
              const tx = targets[i][0], ty = targets[i][1];
              if (Math.abs(tx) > R || Math.abs(ty) > R) return { status: "error", nodes: [tx + "," + ty], msg: "❌ 目標超出步數可達範圍！" };
              if (obstacleMap[getIdx(tx, ty)] === 1) return { status: "error", nodes: [tx + "," + ty], msg: "❌ 目標與障礙物重疊！" };
              if ((Math.abs(tx) + Math.abs(ty)) % 2 !== 0) return { status: "error", nodes: [tx + "," + ty], msg: "❌ 目標奇偶性錯誤，永遠無法抵達。" };
          }

          const dist = (x1, y1, x2, y2) => Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2));

          const P = K + 1;
          const distMat = new Int32Array(P * P);
          const ptsX = new Int32Array(P);
          const ptsY = new Int32Array(P);
          ptsX[0] = 0; ptsY[0] = 0;
          for (let i = 0; i < K; i++) {
              ptsX[i + 1] = targets[i][0];
              ptsY[i + 1] = targets[i][1];
          }
          for (let i = 0; i < P; i++) {
              for (let j = 0; j < P; j++) {
                  distMat[i * P + j] = dist(ptsX[i], ptsY[i], ptsX[j], ptsY[j]);
              }
          }

          const numMasks = 1 << K;
          const dp = new Int32Array(numMasks * K);
          dp.fill(-1);

          function getTspDist(mask, lastIdx) {
              if (mask === 0) return distMat[(lastIdx + 1) * P + 0];
              const memoKey = mask * K + lastIdx;
              if (dp[memoKey] !== -1) return dp[memoKey];
              let minVal = 1e9;
              for (let next = 0; next < K; next++) {
                  if ((mask & (1 << next)) !== 0) {
                      const subMask = mask & ~(1 << next);
                      const cost = distMat[(lastIdx + 1) * P + (next + 1)] + getTspDist(subMask, next);
                      if (cost < minVal) minVal = cost;
                  }
              }
              dp[memoKey] = minVal;
              return minVal;
          }

          let minRequired = 0;
          if (K > 0) {
              minRequired = 1e9;
              for (let first = 0; first < K; first++) {
                  const cost = distMat[0 * P + (first + 1)] + getTspDist((numMasks - 1) & ~(1 << first), first);
                  if (cost < minRequired) minRequired = cost;
              }
          }
          if (minRequired > totalSteps) {
              return { status: "error", nodes: targets.map(t => t[0] + "," + t[1]), msg: "❌ 步數不足：最少需 " + minRequired + " 步。" };
          }

          const qX = new Int32Array(totalCells);
          const qY = new Int32Array(totalCells);
          const flooded = new Uint8Array(totalCells);
          let qHead = 0, qTail = 0;

          qX[qTail] = 0; qY[qTail] = 0; qTail++;
          flooded[getIdx(0, 0)] = 1;

          const fdx = [-1, 1, -1, 1];
          const fdy = [1, 1, -1, -1];
          while (qHead < qTail) {
              const cx = qX[qHead], cy = qY[qHead]; qHead++;
              for (let d = 0; d < 4; d++) {
                  const nx = cx + fdx[d], ny = cy + fdy[d];
                  if (Math.abs(nx) <= R && Math.abs(ny) <= R) {
                      const nidx = getIdx(nx, ny);
                      if (flooded[nidx] === 0 && obstacleMap[nidx] === 0) {
                          flooded[nidx] = 1;
                          qX[qTail] = nx; qY[qTail] = ny; qTail++;
                      }
                  }
              }
          }

          for (let i = 0; i < K; i++) {
              const tx = targets[i][0], ty = targets[i][1];
              if (flooded[getIdx(tx, ty)] === 0) {
                  return { status: "error", nodes: [tx + "," + ty], msg: "❌ 目標被孤立或超出極限範圍！" };
              }
          }

          const targetBitMap = new Int8Array(totalCells);
          targetBitMap.fill(-1);
          for (let i = 0; i < K; i++) {
              targetBitMap[getIdx(targets[i][0], targets[i][1])] = i;
          }

          const visited = new Uint8Array(totalCells);
          visited[getIdx(0, 0)] = 1;

          const pathTurns = new Int8Array(totalSteps);
          const validPaths = [];
          const seenFootprints = new Set();
          const quotas = [
              [Math.floor((totalSteps + 4) / 2), Math.floor((totalSteps - 4) / 2)],
              [Math.floor((totalSteps - 4) / 2), Math.floor((totalSteps + 4) / 2)]
          ];

          let isCapped = false;
          const targetSearchLimit = Math.max(10, requiredCount * 2);

          function estimateLowerBound(cx, cy, mask) {
              if (mask === 0) return Math.max(Math.abs(cx), Math.abs(cy));
              let minVal = 1e9;
              for (let next = 0; next < K; next++) {
                  if ((mask & (1 << next)) !== 0) {
                      const cost = dist(cx, cy, ptsX[next + 1], ptsY[next + 1]) + getTspDist(mask & ~(1 << next), next);
                      if (cost < minVal) minVal = cost;
                  }
              }
              return minVal;
          }

          function willViolateClosure(pTurns, lastTurn, step) {
              if (totalSteps <= 4 || step < totalSteps - 3) return false;
              const first0 = pTurns[0], first1 = pTurns[1], first2 = pTurns[2];
              if (step === totalSteps - 1) {
                  if (lastTurn === pTurns[step - 1] && lastTurn === pTurns[step - 2] && lastTurn === first0) return true;
                  if (lastTurn === pTurns[step - 1] && lastTurn === first0 && lastTurn === first1) return true;
                  if (lastTurn === first0 && lastTurn === first1 && lastTurn === first2) return true;
              }
              return false;
          }

          function dfs(step, x, y, cdir, leftRem, rightRem, unvisitedMask, startDir) {
              if (isCapped) return;
              if (validPaths.length >= targetSearchLimit) {
                  isCapped = true;
                  return;
              }

              if (totalSteps - step < estimateLowerBound(x, y, unvisitedMask)) return;

              if (step === totalSteps) {
                  if (x === 0 && y === 0 && unvisitedMask === 0) {
                      if (totalSteps > 4) {
                          let c0 = pathTurns[0], c1 = pathTurns[1], c2 = pathTurns[2];

  function generateOrigamiPolygons(startDir, pathTurns) {
      let svgElements = '';
      const W = 1.0; 
      // 數學對角線長度是 √2 (約1.414)，實體長度是 2.5。算出兩者的縮放比例

      let cdir = startDir;
      
      let minX = 0, maxX = 0, minY = 0, maxY = 0;
      function updateBounds(x, y) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
      }

      for (let i = 0; i < pathTurns.length; i++) {
          const turn = pathTurns[i];
          const transOffset = (cdir << 1) | (turn === 1 ? 0 : 1);
          
          const math_dx = MAIN_TRANS_DX[transOffset];
          const math_dy = MAIN_TRANS_DY[transOffset];
          const math_nx = math_cx + math_dx;
          const math_ny = math_cy + math_dy;
          
          const phys_cx = math_cx * S, phys_cy = math_cy * S;
          const phys_nx = math_nx * S, phys_ny = math_ny * S;
          
          // 前進方向向量 (長度為 2.5) 與 單位向量 (長度為 1)
          const p_dx = phys_nx - phys_cx, p_dy = phys_ny - phys_cy;
          const len = Math.sqrt(p_dx*p_dx + p_dy*p_dy);

          const w_c3x = end_wx - norm_x * (W/2), w_c3y = end_wy - norm_y * (W/2);
          const w_c4x = end_wx + norm_x * (W/2), w_c4y = end_wy + norm_y * (W/2);
          
          updateBounds(w_c1x, w_c1y); updateBounds(w_c2x, w_c2y);
          updateBounds(w_c3x, w_c3y); updateBounds(w_c4x, w_c4y);
          
          svgElements += `<polygon points="${w_c1x},${w_c1y} ${w_c2x},${w_c2y} ${w_c3x},${w_c3y} ${w_c4x},${w_c4y}" fill="#ffffff" stroke="#111" stroke-width="0.08"/>`;

          const next_math_dx = MAIN_TRANS_DX[next_transOffset];
          const next_math_dy = MAIN_TRANS_DY[next_transOffset];
          
          const next_len = Math.sqrt(next_math_dx*next_math_dx + next_math_dy*next_math_dy);
          const next_u_dx = next_math_dx / next_len;
          const next_u_dy = next_math_dy / next_len;
          
          // 計算外側直角頂點
          const corner_x = phys_nx + (u_dx - next_u_dx) * (W/2);
          const corner_y = phys_ny + (u_dy - next_u_dy) * (W/2);
          
          const p2_x = corner_x - u_dx * W;
          const p2_y = corner_y - u_dy * W;
          const p3_x = corner_x + next_u_dx * W;
          const p3_y = corner_y + next_u_dy * W;
          
          updateBounds(corner_x, corner_y); updateBounds(p2_x, p2_y); updateBounds(p3_x, p3_y);
          
          svgElements += `<polygon points="${corner_x},${corner_y} ${p2_x},${p2_y} ${p3_x},${p3_y}" fill="#111" stroke="#111" stroke-width="0.08"/>`;
          
          math_cx = math_nx;
          math_cy = math_ny;
          cdir = next_cdir;
      }
      return { svgElements, bounds: { minX, maxX, minY, maxY } };

          if (t[0] < minX) minX = t[0]; if (t[0] > maxX) maxX = t[0];

          const o = obstacles[i];

      const boardSize = 2 * R + 1;
      board.style.width = `calc(${boardSize} * var(--cell))`;
      board.style.height = `calc(${boardSize} * var(--cell))`;
      svgOverlay.setAttribute('viewBox', `-${R + 0.5} -${R + 0.5} ${boardSize} ${boardSize}`);
      
      document.getElementById('svg-path').setAttribute('d', '');
      document.getElementById('results-container').innerHTML = '';
      clearAllErrors();

      Array.from(board.children).forEach(c => { if (c.id !== 'svg-overlay') board.removeChild(c); });
      axisX.innerHTML = ''; axisY.innerHTML = '';

      const pad = 15;
      for (let x = -R; x <= R; x++) {
          const lx = document.createElement('div'); lx.className = 'axis-label-x';
          lx.style.left = `calc(${x + R + 0.5} * var(--cell) + ${pad}px)`; lx.innerText = x; axisX.appendChild(lx);
      }
      for (let y = R; y >= -R; y--) {
          const ly = document.createElement('div'); ly.className = 'axis-label-y';
          ly.style.top = `calc(${R - y + 0.5} * var(--cell) + ${pad}px)`; ly.innerText = y; axisY.appendChild(ly);
      }

      for (let y = R; y >= -R; y--) {
          for (let x = -R; x <= R; x++) {
              const node = document.createElement('div');
              node.className = 'node';
              node.dataset.coord = `${x},${y}`;
              node.style.left = `calc(${x + R + 0.5} * var(--cell))`;
              node.style.top = `calc(${R - y + 0.5} * var(--cell))`;

              if ((Math.abs(x) + Math.abs(y)) % 2 !== 0) {
                  node.classList.add('invalid-parity');
              } else {
                  node.classList.add('valid-parity');
                  if (x === 0 && y === 0) {
                      node.classList.add('center'); node.innerHTML = '🏠';
                  } else {
                      if (cellStates[`${x},${y}`] === 1) { node.classList.add('target'); node.innerHTML = '⭐'; }
                      if (cellStates[`${x},${y}`] === 2) { node.classList.add('obstacle'); node.innerHTML = '❌'; }
                      node.onclick = () => toggleNode(x, y, node);
                  }
              }
              board.appendChild(node);
          }
      }
  }

  function handleWorkerResult(result, limit, targets, obstacles) {
      const statusText = document.getElementById('statusText');
      if (result.status === 'success') {
          const validPaths = result.data;
          const chosenPaths = validPaths.slice(0, limit);
          
          const mainSvg = generateArcSvgPath(chosenPaths[0][0], chosenPaths[0][1]);
          document.getElementById('svg-path').setAttribute('d', mainSvg);

          statusText.innerText = `✅ 極速出圖！為您展示 ${chosenPaths.length} 組路線 (${result.elapsed_ms.toFixed(1)}ms)`;
          statusText.style.color = "#28a745";

          const resDiv = document.getElementById('results-container');
          resDiv.innerHTML = '';

          const featsHtml = renderSvgFeatures(targets, obstacles);
          const tStr = targets.length > 0 ? targets.map(t => `<span class="coord-tag">(${t[0]}, ${t[1]})</span>`).join('') : "無";
          const oStr = obstacles.length > 0 ? obstacles.map(o => `<span class="coord-tag">(${o[0]}, ${o[1]})</span>`).join('') : "無";

          chosenPaths.forEach((pathObj, idx) => {
              const pathTurns = pathObj[1];
              
              // 取得「藍色扭扭樂」路徑與邊界
              const arc_d = generateArcSvgPath(pathObj[0], pathTurns);
              const arcBounds = getArcBounds(pathObj[0], pathTurns, targets, obstacles);
              const P = 1.0;
              const arcViewBox = `${arcBounds.minX - P} ${arcBounds.minY - P} ${arcBounds.maxX - arcBounds.minX + 2 * P} ${arcBounds.maxY - arcBounds.minY + 2 * P}`;
              const gridHtml = renderSvgGrid(arcBounds.minX, arcBounds.maxX, arcBounds.minY, arcBounds.maxY, P);
              
              // 取得「精確黑白摺紙拼接圖」SVG 與邊界
              const origamiObj = generateOrigamiPolygons(pathObj[0], pathTurns);
              const oriBounds = origamiObj.bounds;
              const oriP = 0.5;
              const origamiViewBox = `${oriBounds.minX - oriP} ${oriBounds.minY - oriP} ${oriBounds.maxX - oriBounds.minX + 2 * oriP} ${oriBounds.maxY - oriBounds.minY + 2 * oriP}`;

              const infoHtml = `
                  <div style="margin-bottom:8px;"><strong>⭐ 目標：</strong>${tStr}</div>
                  <div><strong>❌ 障礙：</strong>${oStr}</div>
              `;

              const card = document.createElement('div'); card.className = 'thumb-card';
              card.onclick = function() {
                  openModal(arc_d, origamiObj.svgElements, `Result ${idx + 1}`, infoHtml, arcViewBox, origamiViewBox, gridHtml, featsHtml, pathTurns);
              };
              
              // 首頁下方縮圖，確保為「藍色的扭扭樂圓弧圖案」
              card.innerHTML = `
                  <svg class="thumb-svg" viewBox="${arcViewBox}">
                      ${gridHtml}
                      <path d="${arc_d}" fill="none" stroke="#007bff" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/>
                      ${featsHtml}
                  </svg>
                  <div class="thumb-title">Result ${idx + 1}</div>
              `;
              resDiv.appendChild(card);
          });
      } else {
          statusText.innerText = `${result.msg} (${result.elapsed_ms.toFixed(1)}ms)`;
          statusText.style.color = "#dc3545";
          if (result.nodes) {
              result.nodes.forEach(coordStr => {
                  const errNode = document.querySelector(`[data-coord="${coordStr}"]`);
                  if (errNode) errNode.classList.add('error-pulse');
              });
          }
      }
  }

  function autoRun() {
      clearTimeout(debounceTimer);
      
      if (activeWorker) {
          activeWorker.terminate();
          activeWorker = null;
      }

      const statusText = document.getElementById('statusText');
      statusText.innerHTML = "<span class='loader'></span> 深度搜尋中，請稍候... (隨時點擊網格中斷)";
      statusText.style.color = "#007bff";

      document.getElementById('svg-path').setAttribute('d', '');
      document.getElementById('results-container').innerHTML = '';
      clearAllErrors();

      debounceTimer = setTimeout(() => {
          const steps = parseInt(document.getElementById('stepsInput').value, 10);
          const limit = parseInt(document.getElementById('limitInput').value, 10);
          const targets = [], obstacles = [];
          for (const k in cellStates) {
              const parts = k.split(',');
              if (cellStates[k] === 1) targets.push([parseInt(parts[0], 10), parseInt(parts[1], 10)]);
              if (cellStates[k] === 2) obstacles.push([parseInt(parts[0], 10), parseInt(parts[1], 10)]);
          }

          const cacheKey = `${steps}_${limit}_${JSON.stringify(targets)}_${JSON.stringify(obstacles)}`;
          
          if (queryCache.has(cacheKey)) {
              handleWorkerResult(queryCache.get(cacheKey), limit, targets, obstacles);
          } else {
              activeWorker = new Worker(workerUrl);
              activeWorker.onmessage = function(e) {
                  const result = e.data;
                  if (result.status === 'success') {
                      if (queryCache.size > 20) queryCache.delete(queryCache.keys().next().value);
                      queryCache.set(cacheKey, result);
                  }
                  handleWorkerResult(result, limit, targets, obstacles);
                  activeWorker = null;
              };
              activeWorker.postMessage({ steps, targets, obstacles, limit });
          }
      }, 50);
  }

  initGrid(false);
  autoRun();
</script>
