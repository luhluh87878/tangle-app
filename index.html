<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Canvas with Adaptive/Fixed Segments</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; background: #f0f0f0; }
        #sidebar { width: 260px; background: #fff; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10; display: flex; flex-direction: column; gap: 15px; }
        #canvas-container { flex-grow: 1; cursor: grab; background: #ffffff; }
        #canvas-container:active { cursor: grabbing; }
        canvas { display: block; width: 100%; height: 100%; }
        h3 { margin: 0 0 10px 0; font-size: 16px; }
        label, select, input, button { font-size: 14px; width: 100%; box-sizing: border-box; }
        .control-group { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #ddd; }
        button { padding: 8px; cursor: pointer; background: #007BFF; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .flex-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="control-group">
        <h3>1. 互動模式</h3>
        <select id="interactionMode">
            <option value="pan">平移視角 (拖曳)</option>
            <option value="draw">手繪模式 (畫筆)</option>
        </select>
    </div>

    <div class="control-group">
        <h3>2. 生成圖形節數設定</h3>
        <select id="segmentMode">
            <option value="auto">程式判定 (動態平滑)</option>
            <option value="fixed">固定節數</option>
        </select>
        <div class="flex-row">
            <label for="fixedCount">節數:</label>
            <input type="number" id="fixedCount" value="20" min="3" max="500">
        </div>
        <button id="clearBtn" style="margin-top: 15px; background: #dc3545;">清除畫布</button>
    </div>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    // UI Elements
    const interactionMode = document.getElementById('interactionMode');
    const segmentMode = document.getElementById('segmentMode');
    const fixedCount = document.getElementById('fixedCount');
    const clearBtn = document.getElementById('clearBtn');

    // Canvas State (視角變數)
    let offsetX = 0;
    let offsetY = 0;
    let scale = 50; // 初始縮放，表示 1 數學單位 = 50 像素

    // Data Storage (儲存絕對數學座標)
    let handDrawnStrokes = [];
    let currentStroke = null;

    // Interaction State
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        if(offsetX === 0 && offsetY === 0) {
            // 初始將原點置中
            offsetX = canvas.width / 2;
            offsetY = canvas.height / 2;
        }
        render();
    }
    window.addEventListener('resize', resize);

    // 螢幕像素座標 <-> 數學邏輯座標 的轉換函數
    function toLogicX(screenX) { return (screenX - offsetX) / scale; }
    function toLogicY(screenY) { return (screenY - offsetY) / scale; }
    function toScreenX(logicX) { return logicX * scale + offsetX; }
    function toScreenY(logicY) { return logicY * scale + offsetY; }

    // 滑鼠事件處理
    canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;

        if (interactionMode.value === 'draw') {
            currentStroke = [{ x: toLogicX(startX), y: toLogicY(startY) }];
            handDrawnStrokes.push(currentStroke);
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        if (interactionMode.value === 'pan') {
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            offsetX += dx;
            offsetY += dy;
            startX = e.clientX;
            startY = e.clientY;
            render();
        } else if (interactionMode.value === 'draw') {
            currentStroke.push({ x: toLogicX(e.clientX), y: toLogicY(e.clientY) });
            render();
        }
    });

    canvas.addEventListener('mouseup', () => { isDragging = false; currentStroke = null; });
    canvas.addEventListener('mouseleave', () => { isDragging = false; currentStroke = null; });

    // 滾輪縮放 (支援以游標為中心縮放)
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = 1.1;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        // 紀錄縮放前的邏輯座標
        const logicX = toLogicX(mouseX);
        const logicY = toLogicY(mouseY);

        if (e.deltaY < 0) {
            scale *= zoomFactor; // Zoom in
        } else {
            scale /= zoomFactor; // Zoom out
        }

        // 調整偏移量，保持游標位置對應的邏輯座標不變
        offsetX = mouseX - logicX * scale;
        offsetY = mouseY - logicY * scale;
        
        render();
    });

    clearBtn.addEventListener('click', () => {
        handDrawnStrokes = [];
        render();
    });

    // 當節數設定改變時，重新渲染圖形以體現差異
    segmentMode.addEventListener('change', render);
    fixedCount.addEventListener('input', render);

    // 核心渲染函數
    function render() {
        // 1. 清空畫布 (完全空白)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 2. 渲染生成的數學圖形 (例如：一個簡單的拋物線與正弦波組合)
        drawAlgorithmicShape();

        // 3. 渲染手繪軌跡
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#333';

        handDrawnStrokes.forEach(stroke => {
            if (stroke.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(toScreenX(stroke[0].x), toScreenY(stroke[0].y));
            for (let i = 1; i < stroke.length; i++) {
                ctx.lineTo(toScreenX(stroke[i].x), toScreenY(stroke[i].y));
            }
            ctx.stroke();
        });
    }

    function drawAlgorithmicShape() {
        ctx.beginPath();
        ctx.strokeStyle = '#E83E8C'; // 顯眼的粉紅色
        ctx.lineWidth = 3;

        // 決定要繪製的數學範圍 (X軸從 -10 到 10)
        const startLogicX = -10;
        const endLogicX = 10;
        const range = endLogicX - startLogicX;
        
        let segments;
        if (segmentMode.value === 'fixed') {
            segments = Math.max(3, parseInt(fixedCount.value) || 20);
        } else {
            // 自動判定：根據當前的 scale 決定節數 (放大時節數變多，縮小時變少)
            // 假設每 5 個像素需要一個取樣點來保持圓滑
            const pixelWidth = range * scale; 
            segments = Math.max(10, Math.floor(pixelWidth / 5)); 
        }

        const step = range / segments;

        for (let i = 0; i <= segments; i++) {
            const logicalX = startLogicX + (i * step);
            // 函數公式： y = sin(x) + 0.1 * x^2
            const logicalY = Math.sin(logicalX) + 0.1 * (logicalX * logicalX); 
            
            const screenX = toScreenX(logicalX);
            const screenY = toScreenY(-logicalY); // Y軸反轉以符合數學直覺 (上正下負)

            if (i === 0) ctx.moveTo(screenX, screenY);
            else ctx.lineTo(screenX, screenY);
        }
        ctx.stroke();
    }

    // 初始化
    resize();
</script>
</body>
</html>
